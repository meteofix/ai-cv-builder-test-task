server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's embedded DNS; the variable below makes nginx look `api` up again, so a recreated API container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # PDF uploads: the API caps a file at 10 MiB, the margin leaves room for the multipart envelope.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # The API's CSRF check compares Origin with this Host, port included.
        proxy_set_header Host $http_host;
        # Overwrite, never append: a client must not be able to choose the address the login throttler sees.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # One id per response: nginx's, also on errors it produces itself.
        proxy_hide_header X-Request-Id;
        add_header X-Request-Id $request_id always;
        # PDF rendering is capped at 15 s in the API.
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Font files are not content-hashed, so no `immutable`.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Single-page app: any other path is a client route.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
